name: sri_kesar_enterprise_billing
description: Sri Kesar Enterprises Smart Billing & Invoice Management Android App
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  intl: ^0.19.0
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^10.0.2
  open_filex: ^4.5.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  mobile_scanner: ^5.2.3
  speech_to_text: ^6.6.2
  qr_flutter: ^4.1.0
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  http: ^1.2.2
  csv: ^6.0.0
  file_picker: ^8.1.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/sri_kesar_logo.png

flutter_launcher_icons:
  android: true
  image_path: "assets/images/sri_kesar_logo.png"
  min_sdk_android: 23
